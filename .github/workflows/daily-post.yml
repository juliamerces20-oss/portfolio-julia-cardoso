name: Gerar Post Diário

on:
  schedule:
    - cron: '0 12 * * *'  # 09h Brasília = 12h UTC
  workflow_dispatch:       # permite rodar manualmente

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate-post.js

      - name: Commit e push
        run: |
          git config user.name "Julia Bot"
          git config user.email "bot@juliacardoso.dsgn"
          git add blog/ sitemap.xml
          git diff --staged --quiet || git commit -m "post: $(date +'%Y-%m-%d') gerado automaticamente"
          git push
